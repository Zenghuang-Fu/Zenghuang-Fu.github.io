    # NOTE on section titles: al_folio_cv routes some titles to templates written
    # for JSON Resume field names (Skills -> name/keywords, Languages -> name/
    # fluency, Interests -> name/keywords). RenderCV only accepts label/details,
    # so those titles would render empty on the /cv/ page. The titles below
    # deliberately avoid the special-cased ones and fall through to the generic
    # renderer, which understands `bullet` and `label`/`details`.
    Summary:
      - bullet: Master's student at the Institute of Automation, Chinese Academy of Sciences, advised by Weiliang Meng and Xiaopeng Zhang. My research centres on multimodal large models and agentic reinforcement learning, with a focus on long-horizon planning and memory; I also work on video understanding, MLLM reasoning, object detection and multi-object tracking. I am actively looking for PhD positions.
