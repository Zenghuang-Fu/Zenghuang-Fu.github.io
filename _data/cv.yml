    Summary:
      - bullet: Master's student at the Institute of Automation, Chinese Academy of Sciences, advised by Weiliang Meng and Xiaopeng Zhang. My research interests are long-horizon credit assignment for agentic reinforcement learning, agentic search, self-evolving agents and AutoResearch, with a background in agentic memory, agentic RL and long-video understanding with multimodal LLMs. I am actively looking for PhD positions.
    Education:
