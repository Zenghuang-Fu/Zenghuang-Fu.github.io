# Maps a coauthor's last name to their possible first-name spellings.
# No `url` keys here on purpose: author lists in the bibliography are meant to
# stay plain text. The advisors' homepages are linked from the about page and
# the CV instead. Adding a `url` to an entry would turn that name into a link
# wherever it appears within the first `max_author_limit` authors.
