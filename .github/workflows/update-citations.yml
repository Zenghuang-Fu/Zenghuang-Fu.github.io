name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
    - cron: "0 0 * * 3" # Wednesday
    - cron: "0 0 * * 5" # Friday
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/update-citations.yml"
      - "requirements-citations.txt"
      - "bin/update_scholar_citations.py"
      - "test/test_scholar_citations.py"

permissions:
  contents: write

concurrency:
  group: scholar-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-citations.txt

      - name: Install citation dependencies
        run: |
          python -m pip install -r requirements-citations.txt
          python -m pip check
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"

      - name: Test citation updater
        run: python -m unittest discover -s test -p 'test_scholar_citations.py' -v

      - name: Update citation data
        timeout-minutes: 3
        run: python bin/update_scholar_citations.py

      - name: Commit citation data if changed
        run: |
          if [ ! -s _data/citations.yml ]; then
            echo "::error::The updater completed without producing citation data."
            exit 1
          fi
          git add -- _data/citations.yml
          if git diff --cached --quiet; then
            echo "Citation data is unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Update Google Scholar citations"
          git push
          echo "Updated and committed Google Scholar citation data." >> "$GITHUB_STEP_SUMMARY"

      - name: Report update failure
        if: failure()
        run: |
          echo "Citation update failed. Existing citation data was not replaced by an empty result; see the failed step above." >> "$GITHUB_STEP_SUMMARY"
